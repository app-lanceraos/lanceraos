<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lancera — Pro Invoice Templates</title>
<style>
/* ==========================================================================
   LANCERA PRO INVOICE TEMPLATES — data-driven prototype
   --------------------------------------------------------------------------
   Architecture:

     invoice-data.json
            |
     normalizeInvoiceData()      safe defaults, computed presence flags
            |
     shared invoice model
            |
     paginateItems() per template   row-budget heuristic -> page chunks
            |
     TEMPLATES[key] renderer        header / intro / items / footer
            |
     innerHTML into #pageStack
            |
     print / PDF renderer (production, out of scope for this prototype)

   No invoice content is hardcoded in this markup — only gallery chrome
   (sidebar, toolbar, test panel) and the shared rendering primitives below,
   which every one of the 10 Pro templates composes from. This is what
   guarantees a change to invoice-data.json updates all 10 templates
   identically, and that optional-field collapse behaves identically too.

   Pagination note: page breaks are computed from a per-template row-budget
   heuristic (TEMPLATES[*].cfg), not measured DOM height — a browser preview
   cannot reproduce a real paged layout engine. Markup avoids position:
   absolute layouts and keeps items in normal table flow (thead repeats,
   rows avoid breaking) so the same structure can be reproduced by a
   server-side PDF renderer (e.g. WeasyPrint) without a rewrite.
   ========================================================================== */

/* ---------- RESET ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
img { max-width: 100%; display: block; }
table { border-collapse: collapse; width: 100%; }
button { font: inherit; cursor: pointer; }
a { color: inherit; }
p { margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #e7e8ec;
  color: #16181d;
}

/* ---------- APPLICATION SHELL ---------- */
:root{
  --sidebar-bg: #0c0d10;
  --sidebar-text: #eceef2;
  --sidebar-muted: #8c8fa0;
  --sidebar-border: #1e2028;
  --sidebar-hover: #16171e;
}

.app{ display:flex; min-height:100vh; }

.sidebar{
  width:272px; flex-shrink:0; background:var(--sidebar-bg); color:var(--sidebar-text);
  height:100vh; position:sticky; top:0; overflow-y:auto;
  display:flex; flex-direction:column; border-right:1px solid var(--sidebar-border);
}
.sidebar-brand{ padding:26px 24px 18px; border-bottom:1px solid var(--sidebar-border); }
.sidebar-brand .mark{ font-size:12.5px; letter-spacing:.22em; color:var(--sidebar-muted); margin:0 0 4px; text-transform:uppercase; }
.sidebar-brand h1{ font-size:18px; margin:0; font-weight:700; letter-spacing:-0.01em; }

.template-list{ list-style:none; margin:0; padding:10px 10px; flex:1; overflow-y:auto; }
.template-list li + li{ margin-top:2px; }
.template-item{
  all:unset; box-sizing:border-box; display:flex; align-items:center; gap:11px;
  width:100%; padding:10px 12px; border-radius:9px; color:var(--sidebar-text);
}
.template-item:hover{ background:var(--sidebar-hover); }
.template-item.active{ background:linear-gradient(120deg,#2a2d3d,#1c1e28); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
.template-item .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--dot,#999); }
.template-item .item-copy{ min-width:0; }
.template-item .item-name{ display:block; font-size:13.5px; font-weight:600; letter-spacing:-0.005em; }
.template-item .item-desc{ display:block; font-size:11px; color:var(--sidebar-muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.sidebar-foot{ padding:14px 24px 20px; border-top:1px solid var(--sidebar-border); font-size:11px; color:var(--sidebar-muted); line-height:1.6; }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }

.toolbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 30px; background:#fff; border-bottom:1px solid #dcdde3; flex-wrap:wrap; }
.toolbar-copy .eyebrow{ margin:0; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#9497a3; }
.toolbar-copy h2{ margin:2px 0 0; font-size:17px; font-weight:700; color:#14151a; }
.toolbar-actions{ display:flex; align-items:center; gap:10px; }
.btn{ border:1px solid #d3d4db; background:#fff; color:#22242c; padding:9px 16px; border-radius:7px; font-size:13px; font-weight:600; }
.btn:hover{ background:#f3f3f6; }
.btn-primary{ background:#14151a; color:#fff; border-color:#14151a; }
.btn-primary:hover{ background:#2a2b33; }
.btn.active{ background:#eceafc; border-color:#c9c3f7; color:#4a3fd1; }

.test-panel{ background:#fbfbfd; border-bottom:1px solid #dcdde3; padding:14px 30px; }
.test-panel[hidden]{ display:none; }
.test-panel-label{ font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:#9497a3; font-weight:700; margin-bottom:9px; }
.preset-row{ display:flex; flex-wrap:wrap; gap:8px; }
.preset-btn{ all:unset; box-sizing:border-box; cursor:pointer; font-size:12.5px; font-weight:600; color:#3b3d47; background:#fff; border:1px solid #d8d9e0; padding:7px 13px; border-radius:100px; }
.preset-btn:hover{ background:#f0f0f5; }
.preset-btn.active{ background:#4a3fd1; border-color:#4a3fd1; color:#fff; }

.load-error{ margin:14px 30px 0; padding:11px 16px; background:#fff4e5; border:1px solid #f3d8a8; color:#7a5a12; font-size:12.5px; border-radius:8px; line-height:1.6; }
.load-error[hidden]{ display:none; }
.load-error code{ background:rgba(0,0,0,0.06); padding:1px 5px; border-radius:4px; font-size:11.5px; }

.preview-scroll{ flex:1; overflow:auto; padding:44px 24px 90px; }
.page-stack{ display:flex; flex-direction:column; align-items:center; gap:30px; }

/* ---------- SHARED INVOICE STYLES ----------
   Every template composes its layout from these primitives; this is what
   guarantees identical, correct conditional-rendering behaviour across all
   10 designs — only surrounding composition/typography differs per skin. */
.invoice-page{
  position:relative; width:210mm; min-height:297mm; flex-shrink:0;
  background:#fff; box-shadow:0 2px 8px rgba(20,20,30,0.08), 0 22px 50px rgba(20,20,30,0.12);
  font-size:10.8pt; line-height:1.5;
}
.page-body{ }
.doc-title{ font-weight:800; }
.doc-number{ white-space:nowrap; }
.doc-block{ flex-shrink:0; }
.brand-lockup{ display:flex; align-items:center; gap:12px; min-width:0; }
.brand-logo{ object-fit:contain; flex-shrink:0; }
.brand-name{ font-weight:700; color:var(--ink); }

.meta-strip{ display:flex; flex-wrap:wrap; gap:0; }
.meta-item{ display:flex; flex-direction:column; gap:3px; }
.meta-item .k{ font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.meta-item .v{ font-size:12px; font-weight:600; color:var(--ink); }

.parties-row{ display:flex; gap:14mm; }
.party{ flex:1 1 0; min-width:0; }
.party-label{ font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:6px; }
.party-name{ font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:2px; }
.party-line{ font-size:11.5px; color:var(--muted); line-height:1.65; }

.items-wrap{ }
.inv-table thead{ display:table-header-group; }
.inv-table tr{ break-inside:avoid; }
.inv-table thead th{ text-align:left; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:0 14px 8px 0; border-bottom:2px solid var(--ink); }
.inv-table th.num, .inv-table td.num{ text-align:right; }
.inv-table th:last-child, .inv-table td:last-child{ padding-right:0; }
.inv-table td{ font-size:12px; color:var(--ink); padding:9px 14px 9px 0; border-bottom:1px solid var(--rule); vertical-align:top; }
.inv-table td.col-desc{ word-break:break-word; }
.inv-table .empty-row td{ color:var(--muted); font-style:italic; text-align:center; padding:16px 0; }

.block-label{ font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:7px; }

.inv-totals{ width:66mm; margin-left:auto; }
.inv-totals .row{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); padding:5px 0; }
.inv-totals .row.total{ border-top:2px solid var(--ink); margin-top:4px; padding-top:9px; font-size:15px; font-weight:800; color:var(--ink); }

.notes-terms{ display:flex; gap:18px; flex-wrap:wrap; }
.notes-block, .terms-block{ flex:1 1 200px; min-width:0; }
.notes-terms p{ font-size:10.5px; color:var(--muted); line-height:1.65; margin:0; }

.pay-block{ }
.pay-methods{ display:flex; flex-wrap:wrap; gap:9px 22px; margin-bottom:8px; }
.pay-method{ display:flex; flex-direction:column; gap:2px; }
.pay-method-label{ font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.pay-method-value{ font-size:11px; font-weight:600; color:var(--ink); }
.pay-method-value a{ text-decoration:none; color:var(--accent); }
.pay-qr img{ width:20mm; height:20mm; object-fit:contain; border:1px solid var(--rule); padding:2mm; background:#fff; }

.sign-block{ display:inline-flex; flex-direction:column; gap:4px; }
.sign-img{ height:13mm; object-fit:contain; object-position:left; }
.sign-line{ border-top:1px solid var(--rule); padding-top:4px; min-width:44mm; }
.sign-name{ display:block; font-weight:700; color:var(--ink); font-size:11px; }
.sign-label{ display:block; font-size:9.5px; color:var(--muted); margin-top:1px; }

.continuation-header{ display:flex; justify-content:space-between; align-items:center; padding:8mm 16mm; border-bottom:1px solid var(--rule); font-size:10.5px; color:var(--muted); }
.continuation-header .ch-brand{ display:flex; align-items:center; gap:8px; font-weight:700; color:var(--ink); }
.continuation-header .ch-brand img{ height:13px; object-fit:contain; }
.continuation-header .ch-meta{ display:flex; gap:16px; }

.page-badge{ position:absolute; bottom:8mm; right:16mm; font-size:9px; color:var(--muted); letter-spacing:.03em; }

/* =====================================================================
   TEMPLATE SKINS — 10 distinct professional design systems. Each defines
   color/type tokens plus a unique header/intro/footer composition; every
   one reuses the shared primitives above for the actual data (parties,
   table, totals, payment, signature, notes/terms) so conditional-render
   correctness never has to be re-implemented per template.
   ===================================================================== */

/* ---------- 01 · EXECUTIVE — high-end corporate ---------- */
.tpl-executive{ --ink:#151a24; --accent:#1b2a4a; --muted:#6b6f78; --rule:#dddfe3; --paper:#fff; background:var(--paper); color:var(--ink); padding:0; }
.tpl-executive .exec-band{ display:flex; justify-content:space-between; align-items:flex-end; padding:20mm 18mm 8mm; border-bottom:2px solid var(--accent); }
.tpl-executive .brand-logo{ height:34px; width:auto; }
.tpl-executive .brand-name{ font-family:Georgia,'Times New Roman',serif; font-size:20px; font-weight:700; color:var(--accent); }
.tpl-executive .doc-block{ text-align:right; }
.tpl-executive .doc-title{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; font-weight:600; }
.tpl-executive .doc-number{ font-family:Georgia,serif; font-size:22px; font-weight:700; color:var(--ink); }
.tpl-executive .page-body{ padding:10mm 18mm 16mm; }
.tpl-executive .meta-strip{ border:1px solid var(--rule); border-radius:2px; margin-bottom:9mm; gap:0; }
.tpl-executive .meta-item{ flex:1 1 0; padding:9px 14px; border-right:1px solid var(--rule); }
.tpl-executive .meta-item:last-child{ border-right:none; }
.tpl-executive .parties-row{ margin-bottom:9mm; }
.tpl-executive .party + .party{ border-left:1px solid var(--rule); padding-left:22px; }
.tpl-executive .footer-top{ display:flex; justify-content:space-between; gap:24px; margin-bottom:9mm; }
.tpl-executive .footer-top .notes-terms{ flex:1 1 0; max-width:64mm; }
.tpl-executive .footer-top .inv-totals{ flex:0 0 64mm; }
.tpl-executive .exec-payment{ border-top:1px solid var(--rule); padding-top:8mm; margin-bottom:6mm; }
.tpl-executive .exec-payment .pay-methods{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.tpl-executive .footer-close{ border-top:1px solid var(--rule); padding-top:6mm; display:flex; justify-content:flex-end; }

/* ---------- 02 · STUDIO — creative studio ---------- */
.tpl-studio{ --ink:#201d1a; --accent:#b9812a; --muted:#8a8378; --rule:#e4dcca; --paper:#fbf8f2; background:var(--paper); color:var(--ink); padding:0; }
.tpl-studio .stu-header{ display:flex; justify-content:space-between; align-items:flex-start; padding:16mm 16mm 0; }
.tpl-studio .stu-identity{ display:flex; gap:14px; align-items:flex-start; max-width:72mm; }
.tpl-studio .stu-identity img{ height:48px; width:auto; margin-top:2px; object-fit:contain; flex-shrink:0; }
.tpl-studio .stu-seller-name{ font-weight:700; font-size:13px; line-height:1.3; margin-bottom:6px; }
.tpl-studio .stu-seller-line{ font-size:10px; color:var(--muted); line-height:1.6; }
.tpl-studio .stu-doc{ text-align:right; }
.tpl-studio .doc-title{ font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:38px; font-weight:400; color:var(--accent); line-height:1; }
.tpl-studio .doc-number{ font-size:11px; color:var(--muted); margin-top:6px; }
.tpl-studio .stu-doc .meta-strip{ flex-direction:column; align-items:flex-end; gap:6px; margin-top:10px; }
.tpl-studio .stu-doc .meta-item{ flex-direction:row; gap:8px; align-items:baseline; }
.tpl-studio .stu-doc .meta-item .k{ order:1; }
.tpl-studio .stu-doc .meta-item .v{ order:2; }
.tpl-studio .page-body{ padding:0 16mm 16mm; }
.tpl-studio .stu-client{ margin:16mm 0 8mm 40mm; padding-left:14px; border-left:2px solid var(--accent); }
.tpl-studio .items-wrap{ margin-top:8mm; }
.tpl-studio .inv-table thead th{ background:var(--accent); color:#fff; padding:9px 12px; border-bottom:none; }
.tpl-studio .inv-table td{ padding:11px 12px; }
.tpl-studio .stu-bottom{ display:flex; justify-content:space-between; gap:20px; margin-top:9mm; }
.tpl-studio .stu-bottom .notes-terms{ max-width:78mm; }
.tpl-studio .inv-totals .row.total{ color:var(--accent); }
.tpl-studio .stu-closing{ display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-top:11mm; padding-top:6mm; border-top:1px solid var(--rule); }

/* ---------- 03 · SIGNATURE — personal luxury ---------- */
.tpl-signature{ --ink:#26201d; --accent:#6b2e3c; --muted:#8c7f76; --rule:#e7dcd1; --paper:#fbf7f1; background:var(--paper); color:var(--ink); font-family:Georgia,'Times New Roman',serif; padding:22mm 24mm; }
.tpl-signature .sig-top{ text-align:center; }
.tpl-signature .sig-logo{ height:24px; width:auto; margin:0 auto 8px; }
.tpl-signature .sig-mark{ font-size:19px; letter-spacing:.03em; font-weight:700; }
.tpl-signature .sig-sub{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin-top:6px; }
.tpl-signature .sig-hr{ height:1px; background:var(--rule); margin:7mm 0; }
.tpl-signature .sig-meta{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; margin-bottom:9mm; }
.tpl-signature .sig-meta .meta-strip{ justify-content:center; gap:26px; }
.tpl-signature .sig-meta .meta-item{ align-items:center; }
.tpl-signature .parties-row{ justify-content:center; margin-bottom:9mm; }
.tpl-signature .party{ flex:0 0 62mm; text-align:center; }
.tpl-signature .party:first-child{ text-align:right; border-right:1px solid var(--rule); padding-right:14mm; margin-right:14mm; }
.tpl-signature .party:last-child{ text-align:left; }
.tpl-signature .party-label{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
.tpl-signature .inv-table thead th{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; border-bottom-color:var(--accent); }
.tpl-signature .inv-table td:not(.col-desc){ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
.tpl-signature .inv-totals{ margin:8mm 0 8mm auto; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
.tpl-signature .inv-totals .row.total{ border-top-color:var(--accent); color:var(--accent); }
.tpl-signature .notes-terms{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; text-align:center; justify-content:center; margin-bottom:6mm; }
.tpl-signature .notes-terms .notes-block p{ font-style:italic; }
.tpl-signature .sig-footer{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
.tpl-signature .sig-payment{ text-align:right; margin-left:auto; }

/* ---------- 04 · ATELIER — boutique editorial ---------- */
.tpl-atelier{ --ink:#22201b; --accent:#5b6b4f; --muted:#8a8577; --rule:#dad5c8; --paper:#f7f4ee; background:var(--paper); color:var(--ink); padding:0; }
.tpl-atelier .atl-shell{ display:grid; grid-template-columns:38mm 1fr; min-height:297mm; }
.tpl-atelier .atl-rail{ background:#efeae0; border-right:1px solid var(--rule); padding:14mm 8mm; display:flex; flex-direction:column; justify-content:space-between; align-items:center; }
.tpl-atelier .atl-rail-top-group{ display:flex; flex-direction:column; align-items:center; gap:8px; }
.tpl-atelier .atl-rail-logo{ height:20px; width:auto; }
.tpl-atelier .atl-rail-top{ font-family:Georgia,serif; font-size:10.5px; font-weight:700; line-height:1.4; text-align:center; }
.tpl-atelier .atl-rail-mid{ writing-mode:vertical-rl; transform:rotate(180deg); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
.tpl-atelier .atl-rail-bottom{ font-size:8.5px; color:var(--muted); line-height:1.6; text-align:center; }
.tpl-atelier .atl-main{ padding:16mm 16mm 12mm 14mm; }
.tpl-atelier .page-body{ padding:16mm 16mm 12mm 14mm; }
.tpl-atelier .atl-head{ margin-bottom:12mm; }
.tpl-atelier .atl-main .doc-title{ font-family:Georgia,'Times New Roman',serif; font-size:44px; font-weight:400; margin-bottom:6mm; letter-spacing:-0.01em; }
.tpl-atelier .atl-head .meta-strip{ gap:20px; }
.tpl-atelier .atl-section{ display:grid; grid-template-columns:16px 1fr; gap:14px; padding:8mm 0; border-top:1px solid var(--rule); }
.tpl-atelier .atl-section-num{ font-size:10px; color:var(--accent); font-weight:700; padding-top:2px; }
.tpl-atelier .parties-row p, .tpl-atelier .party-line{ line-height:1.7; }
.tpl-atelier .inv-table thead th{ border-bottom:1px solid var(--ink); }
.tpl-atelier .atl-summary{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; }
.tpl-atelier .atl-summary .inv-totals{ flex:1; max-width:70mm; margin:0; }
.tpl-atelier .atl-summary .inv-totals .row.total{ display:none; }
.tpl-atelier .atl-total-due{ text-align:right; flex-shrink:0; }
.tpl-atelier .atl-total-due span{ display:block; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
.tpl-atelier .atl-total-due strong{ font-family:Georgia,serif; font-size:30px; font-weight:400; color:var(--accent); }
.tpl-atelier .atl-foot-grid{ display:flex; gap:32px; flex-wrap:wrap; }
.tpl-atelier .atl-foot-grid > div{ flex:1 1 200px; min-width:0; }
.tpl-atelier .atl-terms{ margin-top:8mm; font-size:9px; color:var(--muted); }

/* ---------- 05 · EDITORIAL — magazine grid ---------- */
.tpl-editorial{ --ink:#101012; --accent:#b94b34; --muted:#6e6e74; --rule:#d8d8dc; --paper:#fff; background:var(--paper); color:var(--ink); padding:18mm 16mm; }
.tpl-editorial .edt-masthead{ display:flex; justify-content:space-between; align-items:flex-end; }
.tpl-editorial .edt-title-group{ display:flex; flex-direction:column; gap:6mm; }
.tpl-editorial .edt-title-group .brand-lockup{ order:2; }
.tpl-editorial .brand-logo{ height:16px; width:auto; }
.tpl-editorial .brand-name{ font-size:11px; letter-spacing:.04em; color:var(--muted); font-weight:600; }
.tpl-editorial .doc-title{ font-size:52px; font-weight:800; letter-spacing:-0.03em; line-height:.9; }
.tpl-editorial .doc-number{ font-size:11px; color:var(--muted); margin-top:6px; }
.tpl-editorial .edt-masthead .meta-strip{ gap:18px; }
.tpl-editorial .edt-masthead .meta-item{ align-items:flex-end; }
.tpl-editorial .edt-rule{ height:3px; background:var(--ink); margin:8mm 0 9mm; }
.tpl-editorial .parties-row{ margin-bottom:9mm; padding-bottom:8mm; border-bottom:1px solid var(--rule); }
.tpl-editorial .party-label{ font-size:9.5px; }
.tpl-editorial .party-name{ font-size:15px; font-weight:800; }
.tpl-editorial .party-line{ font-family:Georgia,'Times New Roman',serif; font-size:11px; color:#333338; }
.tpl-editorial .inv-table thead th{ border-bottom:2px solid var(--ink); font-weight:700; }
.tpl-editorial .inv-table td{ font-family:Georgia,serif; }
.tpl-editorial .inv-table td.num{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
.tpl-editorial .edt-subtotals{ width:64mm; margin:6mm 0 6mm auto; }

<script>
(function(){
"use strict";

/* ==========================================================================
   DATA LOADING + FORMATTING HELPERS
   ========================================================================== */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function formatMoney(amount, symbol){
  var v = Number(amount) || 0;
  var s = v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (symbol || "") + s;
}
function formatDate(d){ return d ? String(d) : ""; } // dates arrive pre-formatted from JSON
function formatQty(n){
  n = Number(n) || 0;
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
}
function round2(n){ return Math.round((Number(n)||0) * 100) / 100; }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function hasValue(v){ return v !== undefined && v !== null && String(v).trim() !== ""; }

function loadInvoiceData(){
  return fetch("./invoice-data.json").then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

function hasLogo(inv){ return inv.business.hasLogo; }
function hasSku(inv){ return inv.hasSku; }
function hasNotes(inv){ return inv.additional.hasNotes; }
function hasTerms(inv){ return inv.additional.hasTermsText; }
function hasSignature(inv){ return inv.additional.signature.enabled; }
function hasQrCode(inv){ return inv.payment.qr.enabled; }
function hasPaymentMethods(inv){ return inv.payment.hasMethods; }

/* ==========================================================================
   NORMALIZATION
   Converts raw JSON into a predictable, render-ready shape: safe defaults,
   trimmed/filtered arrays, and pre-computed "does this section exist" flags
   so templates never repeat the same presence checks.
   ========================================================================== */
function normalizeInvoiceData(raw){
  raw = raw || {};
  var biz = raw.business || {};
  var cli = raw.client || {};
  var invMeta = raw.invoice || {};
  var rawItems = Array.isArray(raw.items) ? raw.items : [];
  var tot = raw.totals || {};
  var pay = raw.payment || {};
  var add = raw.additional || {};

  var business = {
    name: String(biz.name || "").trim(),
    contactName: String(biz.contact_name || "").trim(),
    logo: String(biz.logo || "").trim(),
    hasLogo: !!String(biz.logo || "").trim(),
    address: (Array.isArray(biz.address) ? biz.address : []).map(function(s){ return String(s||"").trim(); }).filter(Boolean),
    email: String(biz.email || "").trim(),
    phone: String(biz.phone || "").trim(),
    website: String(biz.website || "").trim(),
    taxId: String(biz.tax_id || "").trim()
  };

  var client = {
    company: String(cli.company || "").trim(),
    contactName: String(cli.contact_name || "").trim(),
    address: (Array.isArray(cli.address) ? cli.address : []).map(function(s){ return String(s||"").trim(); }).filter(Boolean),
    email: String(cli.email || "").trim(),
    phone: String(cli.phone || "").trim(),
    taxId: String(cli.tax_id || "").trim()
  };

  var currencySymbol = invMeta.currency_symbol || "";

  var items = rawItems.map(function(it){
    var qty = Number(it.quantity) || 0;
    var price = Number(it.unit_price) || 0;
    var amount = it.amount != null ? Number(it.amount) : qty * price;
    return {
      description: String(it.description || "").trim(),
      sku: String(it.sku || "").trim(),
      quantity: qty,
      unitPrice: price,
      amount: Number(amount) || 0
    };
  }).filter(function(it){ return it.description || it.quantity || it.amount; });

  var itemsHaveSku = items.some(function(it){ return !!it.sku; });

  var taxObj = tot.tax || {};
  var discObj = tot.discount || {};
  var totals = {
    subtotal: Number(tot.subtotal) || 0,
    hasTax: !!taxObj.enabled && Number(taxObj.amount) > 0,
    taxLabel: taxObj.label || "Tax",
    taxRate: taxObj.rate,
    taxAmount: Number(taxObj.amount) || 0,
    hasDiscount: !!discObj.enabled && Number(discObj.amount) > 0,
    discountLabel: discObj.label || "Discount",
    discountAmount: Number(discObj.amount) || 0,
    total: Number(tot.total) || 0
  };

  var methods = [];
  if(pay.bank_transfer && pay.bank_transfer.enabled){
    var btLines = [pay.bank_transfer.bank_name, pay.bank_transfer.account_number].map(function(s){ return String(s||"").trim(); }).filter(Boolean);
    if(btLines.length) methods.push({ key:"bank_transfer", label:"Bank Transfer", lines: btLines });
  }
  if(pay.payoneer && pay.payoneer.enabled){
    var pv = String(pay.payoneer.email || "").trim();
    if(pv) methods.push({ key:"payoneer", label:"Payoneer", lines:[pv] });
  }
  if(pay.jazzcash && pay.jazzcash.enabled){
    var jv = String(pay.jazzcash.number || "").trim();
    if(jv) methods.push({ key:"jazzcash", label:"JazzCash", lines:[jv] });
  }
  if(pay.easypaisa && pay.easypaisa.enabled){
    var ev = String(pay.easypaisa.number || "").trim();
    if(ev) methods.push({ key:"easypaisa", label:"Easypaisa", lines:[ev] });
  }
  if(pay.online_payment && pay.online_payment.enabled){
    var ov = String(pay.online_payment.url || "").trim();
    if(ov) methods.push({ key:"online_payment", label:"Online Payment", lines:[ov], isLink:true });
  }
  var qr = {
    enabled: !!(pay.qr_code && pay.qr_code.enabled && String(pay.qr_code.image||"").trim()),
    image: pay.qr_code ? String(pay.qr_code.image || "").trim() : ""
  };

  var signSrc = add.signature || {};
  var signature = {
    enabled: !!(signSrc.enabled && String(signSrc.image||"").trim()),
    image: String(signSrc.image || "").trim(),
    label: signSrc.label || "Authorised signature",
    name: signSrc.name || ""
  };

  var notes = String(add.notes || "").trim();
  var terms = String(add.terms || "").trim();

  return {
    business: business,
    client: client,
    meta: {
      title: invMeta.title || "Invoice",
      number: invMeta.number || "",
      issueDate: formatDate(invMeta.issue_date),
      hasDueDate: !!invMeta.due_date,
      dueDate: formatDate(invMeta.due_date),
      hasPaymentTerms: !!invMeta.payment_terms,
      paymentTerms: invMeta.payment_terms || "",
      hasPO: !!invMeta.po_number,
      poNumber: invMeta.po_number || "",
      currency: invMeta.currency || "",
      currencySymbol: currencySymbol
    },
    items: items,
    hasSku: itemsHaveSku,
    totals: totals,
    payment: { methods: methods, hasMethods: methods.length > 0, qr: qr, hasPayment: methods.length > 0 || qr.enabled },
    additional: {
      notes: notes, hasNotes: !!notes,
      terms: terms, hasTermsText: !!terms,
      hasNotesOrTerms: !!notes || !!terms,
      signature: signature
    }
  };
}

/* ==========================================================================
   RENDERING — shared primitives
   Every template composes its layout from these; this is what guarantees
   identical, correct conditional-rendering behaviour across all 10 designs.
   ========================================================================== */
function brandLockup(inv){
  var b = inv.business;
  if(!b.hasLogo && !b.name) return "";
  var h = '<div class="brand-lockup">';
  if(b.hasLogo) h += '<img class="brand-logo" src="'+esc(b.logo)+'" alt="'+esc(b.name)+' logo" onerror="this.remove()">';
  if(b.name) h += '<div class="brand-name">'+esc(b.name)+'</div>';
  h += '</div>';
  return h;

/* ==========================================================================
   PAGINATION
   Each template declares a row-budget config; paginateItems() splits the
   items array into page chunks, reserving room for the footer block on
   whichever page ends up last.
   ========================================================================== */
function computeCapacity(cfg, isFirst, withFooter){
  var header = isFirst ? cfg.headerFirst : cfg.headerOther;
  var footer = withFooter ? cfg.footer : 0;
  return Math.max(cfg.pageRows - header - footer, 3);
}
function paginateItems(items, cfg){
  var pages = [];
  var remaining = items.slice();
  var first = true;
  while(remaining.length > 0){
    var capWithFooter = computeCapacity(cfg, first, true);
    if(remaining.length <= capWithFooter){
      pages.push({ items: remaining, first: first, last: true });
      remaining = [];
      break;
    }
    var capNoFooter = computeCapacity(cfg, first, false);
    var take = remaining.splice(0, capNoFooter);
    pages.push({ items: take, first: first, last: false });
    first = false;
  }
  if(pages.length === 0){
    pages.push({ items: [], first: true, last: true });
  } else if(!pages[pages.length - 1].last){
    pages.push({ items: [], first: false, last: true });
  }
  return pages;
}
function splitTotalsRows(inv){ return totalsRowsHtml(inv, false); }

          footerHtml = '<div class="stm-subtotals">'+splitTotalsRows(inv)+'</div>'+
            '<div class="stm-closing">'+renderPaymentMethods(inv, { extraClass:"stm-pay" })+notesTermsHtml(inv)+'<div class="footer-close">'+renderSignature(inv)+'</div></div>';
          totalBar = '<div class="stm-total-bar"><span>Total due</span><strong>'+formatMoney(t.total, sym)+'</strong></div>';
        }
        if(p.first){
          return '<section class="invoice-page tpl-statement" data-template="statement" data-page="'+pageNum+'"><div class="stm-flex"><div class="stm-shell">'+rail+
            '<main class="stm-main">'+head+itemsHtml+footerHtml+'</main></div>'+totalBar+'</div>'+badge+'</section>';
        }
        return '<section class="invoice-page tpl-statement" data-template="statement" data-page="'+pageNum+'">'+
          '<div class="stm-flex"><div style="flex:1;">'+continuationHeader(inv, pageNum, n)+'<div class="page-body" style="padding:16mm;">'+itemsHtml+footerHtml+'</div></div>'+totalBar+'</div>'+badge+'</section>';
      }).join("");
    }
  }

};

/* ==========================================================================
   PAGE ASSEMBLY
   ========================================================================== */
function assembleTemplate(key, inv){
  var tpl = TEMPLATES[key];
  var pages = paginateItems(inv.items, tpl.cfg);
  if(tpl.renderFull) return tpl.renderFull(inv, pages);

  var n = pages.length;
  return pages.map(function(p, i){
    var pageNum = i + 1;
    var head = p.first ? tpl.renderHeader(inv) : continuationHeader(inv, pageNum, n);
    var intro = (p.first && tpl.renderIntro) ? tpl.renderIntro(inv) : "";
    var itemsHtml = (tpl.renderItems || renderItems)(inv, p.items, p.last);
    var footHtml = p.last ? tpl.renderFooter(inv) : "";
    var badge = (n > 1 && p.first) ? '<div class="page-badge">Page '+pageNum+' of '+n+'</div>' : "";
    return '<section class="invoice-page tpl-'+key+'" data-template="'+key+'" data-page="'+pageNum+'">'+head+
      '<div class="page-body">'+intro+itemsHtml+footHtml+'</div>'+badge+'</section>';
  }).join("");
}

/* ==========================================================================
   TEST MODES
   ========================================================================== */
function buildManyItems(n){
  var catalog = ["Consulting Session","Design Revision","Development Sprint","Content Writing","SEO Audit","Server Maintenance","Bug Fix Package","Feature Implementation","QA Testing Pass","Client Meeting","Wireframing","Brand Asset Delivery"];
  var items = [];
  for(var i = 0; i < n; i++){
    var qty = 1 + (i % 4);
    var price = 25 + (i % 9) * 15;
    items.push({ description: catalog[i % catalog.length] + " #" + (i + 1), sku:"", quantity: qty, unit_price: price, amount: qty * price });
  }
  return items;
}
function recomputeTotals(d){
  var subtotal = d.items.reduce(function(s, it){
    var amt = it.amount != null ? Number(it.amount) : (Number(it.quantity)||0) * (Number(it.unit_price)||0);
    return s + (Number(amt) || 0);
  }, 0);
  d.totals.subtotal = round2(subtotal);
  if(d.totals.tax && d.totals.tax.enabled){
    d.totals.tax.amount = round2(subtotal * (Number(d.totals.tax.rate) || 0) / 100);
  }
  var tax = (d.totals.tax && d.totals.tax.enabled) ? Number(d.totals.tax.amount) || 0 : 0;
  var discount = (d.totals.discount && d.totals.discount.enabled) ? Number(d.totals.discount.amount) || 0 : 0;
  d.totals.total = round2(subtotal + tax - discount);
}
function longContentify(d){
  d.business.name = "Northstar Digital Studio & Technology Consulting Services International";
  d.business.address = ["Suite 1204, Innovation Business Tower, Phase 8, Block C", "Business District, Gulberg Greens Extension", "Lahore, Punjab, Pakistan 54000"];
  d.client.company = "Vertex International Technology Solutions & Consulting Group";
  d.client.address = ["42-B Main Boulevard, Gulberg III, Near City Complex Roundabout", "Lahore, Punjab, Pakistan 54000"];
  if(d.items[0]) d.items[0].description = "Complete end-to-end website design, development, and deployment including responsive layouts, custom CMS integration, third-party API connections, and comprehensive quality assurance testing across multiple device categories and browsers.";
  if(d.items[1]) d.items[1].description = "Full user experience research, wireframing, interactive prototyping, and high-fidelity visual design covering the entire customer journey from initial landing through checkout and post-purchase engagement.";
  d.additional.notes = "Thank you for choosing Northstar Digital Studio for this engagement. We value the trust you have placed in our team and remain committed to delivering exceptional results throughout our working relationship.";
  d.additional.terms = "Payment is due within 30 days of the invoice date. Late payments may be subject to a 1.5% monthly interest charge. Services remain subject to the agreed statement of work and master services agreement executed between both parties. Any change in project scope may result in a revised estimate.";
  recomputeTotals(d);
  return d;
}

var PRESETS = [
  { key:"full", label:"Full Data", apply:function(d){ return d; } },
  { key:"noNotes", label:"No Notes", apply:function(d){ d.additional.notes = ""; return d; } },
  { key:"noTerms", label:"No Terms", apply:function(d){ d.additional.terms = ""; return d; } },
  { key:"noNotesOrTerms", label:"No Notes or Terms", apply:function(d){ d.additional.notes = ""; d.additional.terms = ""; return d; } },
  { key:"noLogo", label:"No Logo", apply:function(d){ d.business.logo = ""; return d; } },
  { key:"noSignature", label:"No Signature", apply:function(d){ d.additional.signature.enabled = false; return d; } },
  { key:"noQr", label:"No QR", apply:function(d){ d.payment.qr_code.enabled = false; return d; } },
  { key:"noDueDate", label:"No Due Date", apply:function(d){ d.invoice.due_date = ""; return d; } },
  { key:"noPaymentMethods", label:"No Payment Methods", apply:function(d){ ["bank_transfer","payoneer","jazzcash","easypaisa","online_payment"].forEach(function(k){ d.payment[k].enabled = false; }); return d; } },
  { key:"bankOnly", label:"Bank Only", apply:function(d){ ["payoneer","jazzcash","easypaisa","online_payment"].forEach(function(k){ d.payment[k].enabled = false; }); d.payment.qr_code.enabled = false; return d; } },
  { key:"onlineOnly", label:"Online Payment Only", apply:function(d){ ["bank_transfer","payoneer","jazzcash","easypaisa"].forEach(function(k){ d.payment[k].enabled = false; }); return d; } },
  { key:"noTax", label:"No Tax", apply:function(d){ d.totals.tax.enabled = false; recomputeTotals(d); return d; } },
  { key:"noDiscount", label:"No Discount", apply:function(d){ d.totals.discount.enabled = false; recomputeTotals(d); return d; } },
  { key:"noTaxOrDiscount", label:"No Tax or Discount", apply:function(d){ d.totals.tax.enabled = false; d.totals.discount.enabled = false; recomputeTotals(d); return d; } },
  { key:"noSku", label:"No SKU", apply:function(d){ d.items = d.items.map(function(it){ it.sku = ""; return it; }); return d; } },
  { key:"withSku", label:"With SKU", apply:function(d){ d.items = d.items.map(function(it, i){ it.sku = "SKU-" + String(i+1).padStart(4,"0"); return it; }); return d; } },
  { key:"minimalBusiness", label:"Minimal Business Data", apply:function(d){ d.business.contact_name = ""; d.business.phone = ""; d.business.website = ""; d.business.tax_id = ""; return d; } },
  { key:"longContent", label:"Long Content", apply:longContentify },
  { key:"manyItems", label:"Many Items", apply:function(d){ d.items = buildManyItems(32); recomputeTotals(d); return d; } }
];

/* ==========================================================================
   GALLERY + APP STATE
   ========================================================================== */
var RAW = null;
var CURRENT = null;
var activeTemplate = "executive";
var activePreset = "full";

function renderAll(){
  if(!CURRENT) return;
  var inv = normalizeInvoiceData(CURRENT);
  var stack = document.getElementById("pageStack");
  stack.innerHTML = assembleTemplate(activeTemplate, inv);

  var tpl = TEMPLATES[activeTemplate];
  document.getElementById("toolbarTitle").textContent = tpl.name;
  document.getElementById("toolbarTag").textContent = tpl.tag;

  document.querySelectorAll(".template-item").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-template") === activeTemplate);
  });
  document.querySelectorAll(".preset-btn").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-preset") === activePreset);
  });
}

function buildSidebar(){
  var nav = document.getElementById("templateNav");
  var i = 0;
  nav.innerHTML = Object.keys(TEMPLATES).map(function(key){
    i++;
    var t = TEMPLATES[key];
    var num = (i < 10 ? "0" : "") + i;
    return '<li><button type="button" class="template-item" data-template="'+key+'" style="--dot:'+t.dot+'">'+
      '<span class="dot"></span><span class="item-copy"><span class="item-name">'+num+' '+esc(t.name)+'</span>'+
      '<span class="item-desc">'+esc(t.tag)+'</span></span></button></li>';
  }).join("");
  nav.addEventListener("click", function(e){
    var btn = e.target.closest(".template-item");
    if(!btn) return;
    activeTemplate = btn.getAttribute("data-template");
    renderAll();
  });
}

function buildTestPanel(){
  var row = document.getElementById("presetRow");
  row.innerHTML = PRESETS.map(function(p){
    return '<button type="button" class="preset-btn" data-preset="'+p.key+'">'+esc(p.label)+'</button>';
  }).join("");
  row.addEventListener("click", function(e){
    var btn = e.target.closest(".preset-btn");
    if(!btn) return;
    applyPreset(btn.getAttribute("data-preset"));
  });
}

function applyPreset(key){
  var preset = PRESETS.filter(function(p){ return p.key === key; })[0] || PRESETS[0];
  CURRENT = preset.apply(deepClone(RAW));
  activePreset = key;
  renderAll();
}

function wireToolbar(){
  document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
  document.getElementById("testToggleBtn").addEventListener("click", function(){
    var panel = document.getElementById("testPanel");
    var btn = document.getElementById("testToggleBtn");
    panel.hidden = !panel.hidden;
    btn.classList.toggle("active", !panel.hidden);
  });
}

function showLoadError(){
  var el = document.getElementById("loadError");
  var isFile = location.protocol === "file:";
  el.innerHTML = isFile
    ? 'Could not load <code>invoice-data.json</code> — browsers block local file loading over <code>file://</code>. Serve this folder with a local server, e.g. <code>python3 -m http.server</code>, then open <code>http://localhost:8000/proTemplates.html</code>.'
    : 'Could not load <code>invoice-data.json</code>. Make sure the file exists alongside this page.';
  el.hidden = false;
}
function hideLoadError(){ document.getElementById("loadError").hidden = true; }

function init(){
  buildSidebar();
  buildTestPanel();
  wireToolbar();
  renderAll(); // no-op until data arrives, wires up empty state safely

  loadInvoiceData()
    .then(function(data){
      RAW = data;
      CURRENT = deepClone(RAW);
      hideLoadError();
      renderAll();
    })
    .catch(function(){ showLoadError(); });
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

})();
</script>
