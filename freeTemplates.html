<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lancera — Free Invoice Templates</title>
<style>
/* ==========================================================================
   LANCERA FREE INVOICE TEMPLATES — data-driven prototype
   --------------------------------------------------------------------------
   All invoice content is injected by JavaScript from invoice-data.json.
   There is no invoice data in this markup — only gallery chrome (sidebar,
   toolbar, test panel) and the empty page-stack container templates render
   into. See the <script> block for the rendering pipeline:

     fetch(invoice-data.json)
         -> normalizeInvoice()            (safe defaults, computed flags)
         -> paginateItems() per template  (row-budget heuristic)
         -> TEMPLATES[key].renderHeader/renderItems/renderFooter()
         -> innerHTML into #pageStack

   Pagination note: a browser preview cannot reproduce a real paged layout
   engine, so page breaks here are computed from a per-template row-budget
   heuristic (see TEMPLATES[*].cfg) rather than measured DOM height. This is
   intentionally the same shape of problem the eventual WeasyPrint/Django
   renderer solves for real — the markup avoids position:absolute layouts
   and keeps items in normal table flow (thead repeats, rows avoid breaking)
   so it can be reproduced server-side without a rewrite.
   ========================================================================== */

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
img { max-width: 100%; display: block; }
table { border-collapse: collapse; width: 100%; }
button { font: inherit; cursor: pointer; }
a { color: inherit; }
p { margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #e7e8ec;
  color: #16181d;
}

/* ---------- Gallery chrome tokens ---------- */
:root{
  --gallery-bg: #e7e8ec;
  --sidebar-bg: #0c0d10;
  --sidebar-text: #eceef2;
  --sidebar-muted: #8c8fa0;
  --sidebar-border: #1e2028;
  --sidebar-hover: #16171e;
}

/* ---------- App shell ---------- */
.app{ display:flex; min-height:100vh; }

.sidebar{
  width:272px; flex-shrink:0; background:var(--sidebar-bg); color:var(--sidebar-text);
  height:100vh; position:sticky; top:0; overflow-y:auto;
  display:flex; flex-direction:column; border-right:1px solid var(--sidebar-border);
}
.sidebar-brand{ padding:26px 24px 18px; border-bottom:1px solid var(--sidebar-border); }
.sidebar-brand .mark{ font-size:12.5px; letter-spacing:.22em; color:var(--sidebar-muted); margin:0 0 4px; text-transform:uppercase; }
.sidebar-brand h1{ font-size:18px; margin:0; font-weight:700; letter-spacing:-0.01em; }

.template-list{ list-style:none; margin:0; padding:10px 10px; flex:1; overflow-y:auto; }
.template-list li + li{ margin-top:2px; }
.template-item{
  all:unset; box-sizing:border-box; display:flex; align-items:center; gap:11px;
  width:100%; padding:10px 12px; border-radius:9px; color:var(--sidebar-text);
}
.template-item:hover{ background:var(--sidebar-hover); }
.template-item.active{ background:linear-gradient(120deg,#2a2d3d,#1c1e28); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
.template-item .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--dot,#999); }
.template-item .item-copy{ min-width:0; }
.template-item .item-name{ display:block; font-size:13.5px; font-weight:600; letter-spacing:-0.005em; }
.template-item .item-desc{ display:block; font-size:11px; color:var(--sidebar-muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.sidebar-foot{ padding:14px 24px 20px; border-top:1px solid var(--sidebar-border); font-size:11px; color:var(--sidebar-muted); line-height:1.6; }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }

/* ---------- Toolbar ---------- */
.toolbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 30px; background:#fff; border-bottom:1px solid #dcdde3; flex-wrap:wrap; }
.toolbar-copy .eyebrow{ margin:0; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#9497a3; }
.toolbar-copy h2{ margin:2px 0 0; font-size:17px; font-weight:700; color:#14151a; }
.toolbar-actions{ display:flex; align-items:center; gap:10px; }
.btn{ border:1px solid #d3d4db; background:#fff; color:#22242c; padding:9px 16px; border-radius:7px; font-size:13px; font-weight:600; }
.btn:hover{ background:#f3f3f6; }
.btn-primary{ background:#14151a; color:#fff; border-color:#14151a; }
.btn-primary:hover{ background:#2a2b33; }
.btn.active{ background:#eceafc; border-color:#c9c3f7; color:#4a3fd1; }

/* ---------- Test panel ---------- */
.test-panel{ background:#fbfbfd; border-bottom:1px solid #dcdde3; padding:14px 30px; }
.test-panel[hidden]{ display:none; }
.test-panel-label{ font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:#9497a3; font-weight:700; margin-bottom:9px; }
.preset-row{ display:flex; flex-wrap:wrap; gap:8px; }
.preset-btn{ all:unset; box-sizing:border-box; cursor:pointer; font-size:12.5px; font-weight:600; color:#3b3d47; background:#fff; border:1px solid #d8d9e0; padding:7px 13px; border-radius:100px; }
.preset-btn:hover{ background:#f0f0f5; }
.preset-btn.active{ background:#4a3fd1; border-color:#4a3fd1; color:#fff; }

/* ---------- Load error banner ---------- */
.load-error{ margin:14px 30px 0; padding:11px 16px; background:#fff4e5; border:1px solid #f3d8a8; color:#7a5a12; font-size:12.5px; border-radius:8px; line-height:1.6; }
.load-error[hidden]{ display:none; }
.load-error code{ background:rgba(0,0,0,0.06); padding:1px 5px; border-radius:4px; font-size:11.5px; }

/* ---------- Preview area ---------- */
.preview-scroll{ flex:1; overflow:auto; padding:44px 24px 90px; }
.page-stack{ display:flex; flex-direction:column; align-items:center; gap:30px; }

/* ---------- Shared invoice-page primitives ---------- */
.invoice-page{
  position:relative; width:210mm; min-height:297mm; flex-shrink:0;
  background:#fff; box-shadow:0 2px 8px rgba(20,20,30,0.08), 0 22px 50px rgba(20,20,30,0.12);
  font-size:10.8pt; line-height:1.5;
}
.page-body{ }
.doc-title{ font-weight:800; }
.doc-number{ }
.brand-lockup{ display:flex; align-items:center; gap:12px; min-width:0; }
.brand-logo{ object-fit:contain; flex-shrink:0; }
.brand-name{ font-weight:700; color:var(--ink); }

.meta-strip{ display:flex; flex-wrap:wrap; gap:0; }
.meta-item{ display:flex; flex-direction:column; gap:3px; }
.meta-item .k{ font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.meta-item .v{ font-size:12px; font-weight:600; color:var(--ink); }

.parties-row{ display:flex; gap:14mm; }
.party{ flex:1 1 0; min-width:0; }
.party-label{ font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:6px; }
.party-name{ font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:2px; }
.party-line{ font-size:11.5px; color:var(--muted); line-height:1.65; }

.items-wrap{ }
.inv-table thead{ display:table-header-group; }
.inv-table tr{ break-inside:avoid; }
.inv-table thead th{ text-align:left; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:0 0 8px; border-bottom:2px solid var(--ink); }
.inv-table th.num, .inv-table td.num{ text-align:right; }
.inv-table td{ font-size:12px; color:var(--ink); padding:9px 0; border-bottom:1px solid var(--rule); vertical-align:top; }
.inv-table td.col-desc{ word-break:break-word; }
.inv-table .empty-row td{ color:var(--muted); font-style:italic; text-align:center; padding:16px 0; }

.block-label{ font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:7px; }

.inv-totals{ width:66mm; margin-left:auto; }
.inv-totals .row{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); padding:5px 0; }
.inv-totals .row.total{ border-top:2px solid var(--ink); margin-top:4px; padding-top:9px; font-size:15px; font-weight:800; color:var(--ink); }

.notes-terms{ display:flex; gap:18px; flex-wrap:wrap; }
.notes-block, .terms-block{ flex:1 1 200px; min-width:0; }
.notes-terms p{ font-size:10.5px; color:var(--muted); line-height:1.65; margin:0; }

.pay-block{ }
.pay-methods{ display:flex; flex-wrap:wrap; gap:9px 22px; margin-bottom:8px; }
.pay-method{ display:flex; flex-direction:column; gap:2px; }
.pay-method-label{ font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.pay-method-value{ font-size:11px; font-weight:600; color:var(--ink); }
.pay-method-value a{ text-decoration:none; color:var(--accent); }
.pay-qr img{ width:20mm; height:20mm; object-fit:contain; border:1px solid var(--rule); padding:2mm; background:#fff; }

.sign-block{ display:inline-flex; flex-direction:column; gap:4px; }
.sign-img{ height:13mm; object-fit:contain; object-position:left; }
.sign-line{ border-top:1px solid var(--rule); padding-top:4px; min-width:44mm; }
.sign-name{ display:block; font-weight:700; color:var(--ink); font-size:11px; }
.sign-label{ display:block; font-size:9.5px; color:var(--muted); margin-top:1px; }

.continuation-header{ display:flex; justify-content:space-between; align-items:center; padding:8mm 16mm; border-bottom:1px solid var(--rule); font-size:10.5px; color:var(--muted); }
.continuation-header .ch-brand{ display:flex; align-items:center; gap:8px; font-weight:700; color:var(--ink); }
.continuation-header .ch-brand img{ height:13px; object-fit:contain; }
.continuation-header .ch-meta{ display:flex; gap:16px; }

.page-badge{ position:absolute; bottom:8mm; right:16mm; font-size:9px; color:var(--muted); letter-spacing:.03em; }

/* ---------- Responsive ---------- */
@media (max-width: 900px){
  .sidebar{ width:74px; }
  .sidebar-brand h1, .sidebar-brand .mark, .item-copy{ display:none; }
  .template-item{ justify-content:center; padding:12px 0; }
  .sidebar-foot{ display:none; }
  .toolbar{ padding:14px 16px; }
  .test-panel{ padding:12px 16px; }
  .preview-scroll{ padding:24px 10px 60px; }
  .load-error{ margin:14px 16px 0; }
}

/* ---------- Print ---------- */
@page{ size:A4; margin:0; }
@media print{
  html, body{ background:#fff !important; }
  .gallery-ui{ display:none !important; }
  .preview-scroll{ overflow:visible; padding:0; }
  .page-stack{ gap:0; }
  .invoice-page{ box-shadow:none; margin:0 auto; break-after:page; }
  .invoice-page:last-child{ break-after:auto; }
}

/* ==========================================================================
   TEMPLATE SKINS — each defines its color/type tokens plus the unique
   header/footer composition described in prompt1.md §28–37. Shared
   component classes above (inv-table, inv-totals, party, pay-block,
   sign-block, notes-terms, continuation-header) are reused everywhere so
   conditional-rendering behaviour is identical across all 10 designs; only
   the surrounding composition differs.
   ========================================================================== */

/* ---------- 01 · ESSENTIAL — balanced universal starter ---------- */
.tpl-essential{ --ink:#16181d; --muted:#70737f; --accent:#2455a6; --rule:#e4e6ec; --paper:#fff; background:var(--paper); color:var(--ink); padding:20mm 18mm; }
.tpl-essential .e-head{ display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:11mm; border-bottom:1px solid var(--rule); }
.tpl-essential .brand-logo{ width:12mm; height:12mm; }
.tpl-essential .brand-name{ font-size:15px; }
.tpl-essential .doc-title{ font-size:25px; letter-spacing:.01em; text-align:right; }
.tpl-essential .doc-number{ font-size:12px; color:var(--muted); margin-top:5px; text-align:right; font-weight:600; }
.tpl-essential .meta-strip{ gap:24px; margin:8mm 0 9mm; }
.tpl-essential .parties-row{ margin-bottom:9mm; }
.tpl-essential .inv-totals{ margin-top:7mm; }
.tpl-essential .footer-grid{ display:flex; gap:16mm; margin-top:11mm; padding-top:9mm; border-top:1px solid var(--rule); align-items:flex-start; }
.tpl-essential .footer-grid > div{ flex:1 1 0; min-width:0; }
.tpl-essential .footer-sign{ display:flex; justify-content:flex-end; flex:0 0 auto; }

/* ---------- 02 · CLEAN — airy typography-led SaaS invoice ---------- */
.tpl-clean{ --ink:#14151a; --muted:#9a9dab; --accent:#5d5680; --rule:#e7e8ee; --paper:#fff; background:var(--paper); color:var(--ink); padding:24mm 20mm 20mm; }
.tpl-clean .c-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.tpl-clean .brand-lockup{ flex-direction:column; align-items:flex-start; gap:8px; }
.tpl-clean .brand-logo{ width:9mm; height:9mm; }
.tpl-clean .brand-name{ font-size:13px; letter-spacing:.02em; }
.tpl-clean .doc-title{ font-size:32px; font-weight:300; letter-spacing:.1em; text-transform:uppercase; }
.tpl-clean .doc-number{ font-size:11px; color:var(--muted); margin-top:6px; text-align:right; }
.tpl-clean .meta-strip{ margin-top:14mm; gap:10mm; }
.tpl-clean .meta-item{ border-top:1px solid var(--rule); padding-top:7px; flex:1 1 0; }
.tpl-clean .parties-row{ margin-top:12mm; }
.tpl-clean .parties-row .party:last-child{ text-align:right; }
.tpl-clean .items-wrap{ margin-top:13mm; }
.tpl-clean .inv-table thead th{ font-weight:500; border-bottom:1px solid var(--rule); }
.tpl-clean .inv-totals{ margin-top:8mm; }
.tpl-clean .inv-totals .row.total{ font-weight:300; font-size:18px; letter-spacing:.02em; }
.tpl-clean .footer-grid{ display:flex; justify-content:space-between; gap:18px; margin-top:16mm; padding-top:9mm; border-top:1px solid var(--rule); }
.tpl-clean .footer-grid > div{ flex:1 1 0; min-width:0; }
.tpl-clean .footer-sign{ display:flex; flex-direction:column; align-items:flex-end; }

/* ---------- 03 · CLASSIC — traditional letterhead ---------- */
.tpl-classic{ --ink:#262a33; --muted:#6b7080; --accent:#1c2f4a; --rule:#d7dae2; --paper:#fff; background:var(--paper); color:var(--ink); padding:18mm 17mm; font-family:Georgia,'Times New Roman',serif; }
.tpl-classic .cl-eyebrow{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:6mm; }
.tpl-classic .c-top{ display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:7mm; border-bottom:3px solid var(--accent); }
.tpl-classic .brand-logo{ width:11mm; height:11mm; }
.tpl-classic .brand-name{ font-size:16px; }
.tpl-classic .doc-title{ font-size:22px; letter-spacing:.06em; text-align:right; }
.tpl-classic .doc-number{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; font-size:11px; color:var(--muted); margin-top:5px; text-align:right; }
.tpl-classic .meta-strip{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; justify-content:flex-end; gap:7mm; margin-top:5mm; }
.tpl-classic .meta-item{ align-items:flex-end; }
.tpl-classic .billto-box{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; margin-top:9mm; border:1px solid var(--rule); padding:6mm 7mm; }
.tpl-classic .parties-row{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
.tpl-classic .items-wrap{ margin-top:9mm; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
.tpl-classic .inv-table thead th{ background:var(--accent); color:#fff; padding:8px 10px; border-bottom:none; }
.tpl-classic .inv-table td{ padding:9px 10px; }
.tpl-classic .inv-table tbody tr:nth-child(even){ background:#f7f8fa; }
.tpl-classic .inv-totals{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; margin-top:6mm; border:1px solid var(--rule); width:70mm; }
.tpl-classic .inv-totals .row{ padding:6px 10px; border-bottom:1px solid var(--rule); }
.tpl-classic .inv-totals .row.total{ border-top:none; background:var(--accent); color:#fff; padding:9px 10px; margin:0; }
.tpl-classic .footer-grid{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; display:flex; gap:10mm; margin-top:10mm; align-items:flex-start; }
.tpl-classic .footer-grid > div{ flex:1 1 0; min-width:0; }
.tpl-classic .pay-box{ border:1px solid var(--rule); padding:6mm 7mm; }
.tpl-classic .footer-sign{ display:flex; justify-content:flex-end; }

/* ---------- 04 · SIMPLE — maximum clarity, single flowing column ---------- */
.tpl-simple{ --ink:#202531; --muted:#7d8393; --accent:#3f7ae0; --rule:#e3e6ec; --paper:#fff; background:var(--paper); color:var(--ink); padding:22mm 22mm; font-size:12.5px; }
.tpl-simple .s-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.tpl-simple .brand-logo{ width:10mm; height:10mm; }
.tpl-simple .brand-name{ font-size:15px; }
.tpl-simple .doc-title{ font-size:22px; color:var(--accent); text-align:right; }
.tpl-simple .doc-number{ font-size:12px; color:var(--muted); margin-top:5px; text-align:right; }
.tpl-simple .meta-strip{ gap:22px; margin-top:8mm; }
.tpl-simple .meta-item .v{ font-weight:600; }
.tpl-simple .parties-row{ margin-top:11mm; }
.tpl-simple .items-wrap{ margin-top:10mm; }
.tpl-simple .inv-table thead th{ font-weight:700; border-bottom-width:2px; border-color:var(--rule); color:var(--muted); }
.tpl-simple .inv-totals{ margin-top:8mm; }
.tpl-simple .inv-totals .row.total{ color:var(--accent); border-top-color:var(--rule); }
.tpl-simple .footer-stack{ margin-top:13mm; display:flex; flex-direction:column; gap:11mm; }
.tpl-simple .footer-sign{ margin-top:2mm; }

/* ---------- 05 · MINIMAL — premium asymmetric minimalism ---------- */
.tpl-minimal{ --ink:#17181b; --muted:#adaeb6; --accent:#17181b; --rule:#ebebee; --paper:#fff; background:var(--paper); color:var(--ink); font-family:'Helvetica Neue',Arial,sans-serif; }
.tpl-minimal .m-shell{ display:flex; }
.tpl-minimal .m-rail{ flex:0 0 54mm; padding:26mm 8mm 16mm 22mm; }
.tpl-minimal .m-main{ flex:1 1 0; min-width:0; padding:26mm 22mm 16mm 14mm; }
.tpl-minimal .m-rail .brand-lockup{ flex-direction:column; align-items:flex-start; gap:8px; margin-bottom:12mm; }
.tpl-minimal .m-rail .brand-logo{ width:8mm; height:8mm; }
.tpl-minimal .m-rail .brand-name{ font-size:11.5px; }
.tpl-minimal .m-rail .party + .party{ margin-top:9mm; }
.tpl-minimal .m-rail .party-label{ color:var(--muted); letter-spacing:.16em; font-size:9px; }
.tpl-minimal .m-rail .meta-strip{ flex-direction:column; gap:8mm; margin-top:9mm; }
.tpl-minimal .m-rail .meta-item .k{ letter-spacing:.16em; }
.tpl-minimal .doc-title{ font-size:56px; font-weight:200; letter-spacing:-0.02em; line-height:1; }
.tpl-minimal .doc-number{ font-size:11px; color:var(--muted); margin-top:6mm; letter-spacing:.03em; }
.tpl-minimal .items-wrap{ margin-top:15mm; }
.tpl-minimal .inv-table thead th{ font-weight:500; letter-spacing:.12em; }
.tpl-minimal .inv-table td{ font-weight:300; }
.tpl-minimal .inv-totals{ margin-top:9mm; width:auto; }
.tpl-minimal .inv-totals .row{ max-width:64mm; margin-left:auto; }
.tpl-minimal .inv-totals .row.total{ border-top:none; padding-top:6px; }
.tpl-minimal .inv-totals .row.total span:first-child{ font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); align-self:flex-end; padding-bottom:5px; }
.tpl-minimal .inv-totals .row.total span:last-child{ font-size:32px; font-weight:200; }
.tpl-minimal .m-foot{ display:flex; margin-top:16mm; gap:14mm; }
.tpl-minimal .m-foot > div{ flex:1 1 0; min-width:0; }
.tpl-minimal .pay-qr img{ width:15mm; height:15mm; border:none; opacity:.9; }
.tpl-minimal .footer-sign{ text-align:right; display:flex; flex-direction:column; align-items:flex-end; }
.tpl-minimal .sign-img{ opacity:.85; }

/* ---------- 06 · MODERN — contemporary SaaS/startup invoice ---------- */
.tpl-modern{ --ink:#201f33; --muted:#8b88a8; --accent:#4f46e5; --rule:#eceafb; --paper:#fff; background:var(--paper); color:var(--ink); padding:0; }
.tpl-modern .hero-band{ background:linear-gradient(125deg,#4f46e5,#6d5bd0); color:#fff; padding:14mm 16mm 12mm; display:flex; justify-content:space-between; align-items:flex-start; }
.tpl-modern .hero-band .brand-logo{ width:11mm; height:11mm; background:#fff; border-radius:8px; padding:2mm; }
.tpl-modern .hero-band .brand-name{ color:#fff; font-size:15px; }
.tpl-modern .hero-band .doc-title{ font-size:22px; text-align:right; }
.tpl-modern .hero-band .doc-number{ font-size:11.5px; color:rgba(255,255,255,.85); margin-top:4px; text-align:right; }
.tpl-modern .page-body{ padding:0 16mm 16mm; }
.tpl-modern .meta-strip{ background:#fff; border-radius:10px; box-shadow:0 8px 22px rgba(79,70,229,.14); margin-top:-8mm; position:relative; z-index:2; padding:6mm 7mm; gap:0; justify-content:space-between; }
.tpl-modern .meta-item{ flex:1 1 0; }
.tpl-modern .parties-row{ margin-top:11mm; }
.tpl-modern .items-wrap{ margin-top:10mm; }
.tpl-modern .inv-table thead th{ background:#f2f1fb; color:var(--accent); border-bottom:none; padding:9px 10px; }
.tpl-modern .inv-table td{ padding:10px 10px; }
.tpl-modern .footer-grid{ display:flex; gap:10mm; margin-top:8mm; align-items:flex-start; }
.tpl-modern .footer-grid > div{ flex:1 1 0; min-width:0; }
.tpl-modern .pay-box{ background:#f7f7fc; border-radius:10px; padding:6mm 7mm; }

<div class="app">

  <aside class="sidebar gallery-ui">
    <div class="sidebar-brand">
      <p class="mark">LANCERA</p>
      <h1>Free Templates</h1>
    </div>

    <div class="sidebar-foot">10 Free templates · one shared JSON dataset · use Test Data to verify optional-field behaviour.</div>
  </aside>

      <div class="test-panel-label">Simulate missing / edge-case data (in-memory only — invoice-data.json is never modified)</div>

<script>
(function(){
"use strict";

/* ==========================================================================
   1. HELPERS
   ========================================================================== */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function formatCurrency(amount, symbol){
  var v = Number(amount) || 0;
  var s = v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (symbol || "") + s;
}
function formatDate(d){ return d ? String(d) : ""; } // dates arrive pre-formatted from JSON
function formatQty(n){
  n = Number(n) || 0;
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
}
function round2(n){ return Math.round((Number(n)||0) * 100) / 100; }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function hasLogo(inv){ return inv.business.hasLogo; }
function hasSku(inv){ return inv.hasSku; }
function hasNotes(inv){ return inv.additional.hasNotes; }
function hasTerms(inv){ return inv.additional.hasTermsText; }
function hasSignature(inv){ return inv.additional.signature.enabled; }
function hasQrCode(inv){ return inv.payment.qr.enabled; }
function hasPaymentMethods(inv){ return inv.payment.hasMethods; }

/* ==========================================================================
   2. NORMALIZATION LAYER
   Converts raw JSON into a predictable, render-ready shape: safe defaults,
   trimmed/filtered arrays, and pre-computed "does this section exist" flags
   so templates never repeat the same presence checks.
   ========================================================================== */
function normalizeInvoice(raw){
  raw = raw || {};
  var biz = raw.business || {};
  var cli = raw.client || {};
  var invMeta = raw.invoice || {};
  var rawItems = Array.isArray(raw.items) ? raw.items : [];
  var tot = raw.totals || {};
  var pay = raw.payment || {};
  var add = raw.additional || {};

  var business = {
    name: String(biz.name || "").trim(),
    contactName: String(biz.contact_name || "").trim(),
    logo: String(biz.logo || "").trim(),
    hasLogo: !!String(biz.logo || "").trim(),
    address: (Array.isArray(biz.address) ? biz.address : []).map(function(s){ return String(s||"").trim(); }).filter(Boolean),
    email: String(biz.email || "").trim(),
    phone: String(biz.phone || "").trim(),
    website: String(biz.website || "").trim(),
    taxId: String(biz.tax_id || "").trim()
  };

  var client = {
    company: String(cli.company || "").trim(),
    contactName: String(cli.contact_name || "").trim(),
    address: (Array.isArray(cli.address) ? cli.address : []).map(function(s){ return String(s||"").trim(); }).filter(Boolean),
    email: String(cli.email || "").trim(),
    phone: String(cli.phone || "").trim(),
    taxId: String(cli.tax_id || "").trim()
  };

  var currencySymbol = invMeta.currency_symbol || "";

  var items = rawItems.map(function(it){
    var qty = Number(it.quantity) || 0;
    var price = Number(it.unit_price) || 0;
    var amount = it.amount != null ? Number(it.amount) : qty * price;
    return {
      description: String(it.description || "").trim(),
      sku: String(it.sku || "").trim(),
      quantity: qty,
      unitPrice: price,
      amount: Number(amount) || 0
    };
  }).filter(function(it){ return it.description || it.quantity || it.amount; });

  var itemsHaveSku = items.some(function(it){ return !!it.sku; });

  var taxObj = tot.tax || {};
  var discObj = tot.discount || {};
  var totals = {
    subtotal: Number(tot.subtotal) || 0,
    hasTax: !!taxObj.enabled && Number(taxObj.amount) > 0,
    taxLabel: taxObj.label || "Tax",
    taxRate: taxObj.rate,
    taxAmount: Number(taxObj.amount) || 0,
    hasDiscount: !!discObj.enabled && Number(discObj.amount) > 0,
    discountLabel: discObj.label || "Discount",
    discountAmount: Number(discObj.amount) || 0,
    total: Number(tot.total) || 0
  };

  var methods = [];
  if(pay.bank_transfer && pay.bank_transfer.enabled){
    var btLines = [pay.bank_transfer.bank_name, pay.bank_transfer.account_number].map(function(s){ return String(s||"").trim(); }).filter(Boolean);
    if(btLines.length) methods.push({ key:"bank_transfer", label:"Bank Transfer", lines: btLines });
  }
  if(pay.payoneer && pay.payoneer.enabled){
    var pv = String(pay.payoneer.email || "").trim();
    if(pv) methods.push({ key:"payoneer", label:"Payoneer", lines:[pv] });
  }
  if(pay.jazzcash && pay.jazzcash.enabled){
    var jv = String(pay.jazzcash.number || "").trim();
    if(jv) methods.push({ key:"jazzcash", label:"JazzCash", lines:[jv] });
  }
  if(pay.easypaisa && pay.easypaisa.enabled){
    var ev = String(pay.easypaisa.number || "").trim();
    if(ev) methods.push({ key:"easypaisa", label:"Easypaisa", lines:[ev] });
  }
  if(pay.online_payment && pay.online_payment.enabled){
    var ov = String(pay.online_payment.url || "").trim();
    if(ov) methods.push({ key:"online_payment", label:"Online Payment", lines:[ov], isLink:true });
  }
  var qr = {
    enabled: !!(pay.qr_code && pay.qr_code.enabled && String(pay.qr_code.image||"").trim()),
    image: pay.qr_code ? String(pay.qr_code.image || "").trim() : ""
  };

  var signSrc = add.signature || {};
  var signature = {
    enabled: !!(signSrc.enabled && String(signSrc.image||"").trim()),
    image: String(signSrc.image || "").trim(),
    label: signSrc.label || "Authorised signature",
    name: signSrc.name || ""
  };

  var notes = String(add.notes || "").trim();
  var terms = String(add.terms || "").trim();

  return {
    business: business,
    client: client,
    meta: {
      title: invMeta.title || "Invoice",
      number: invMeta.number || "",
      issueDate: formatDate(invMeta.issue_date),
      hasDueDate: !!invMeta.due_date,
      dueDate: formatDate(invMeta.due_date),
      hasPaymentTerms: !!invMeta.payment_terms,
      paymentTerms: invMeta.payment_terms || "",
      hasPO: !!invMeta.po_number,
      poNumber: invMeta.po_number || "",
      currency: invMeta.currency || "",
      currencySymbol: currencySymbol
    },
    items: items,
    hasSku: itemsHaveSku,
    totals: totals,
    payment: { methods: methods, hasMethods: methods.length > 0, qr: qr, hasPayment: methods.length > 0 || qr.enabled },
    additional: {
      notes: notes, hasNotes: !!notes,
      terms: terms, hasTermsText: !!terms,
      hasNotesOrTerms: !!notes || !!terms,
      signature: signature
    }
  };
}

/* ==========================================================================
   3. SHARED RENDER PRIMITIVES
   Every template composes its layout from these — this is what guarantees
   identical, correct conditional-rendering behaviour across all 10 designs.
   ========================================================================== */
function brandLockup(inv){
  var b = inv.business;
  if(!b.hasLogo && !b.name) return "";
  var h = '<div class="brand-lockup">';
  if(b.hasLogo) h += '<img class="brand-logo" src="'+esc(b.logo)+'" alt="'+esc(b.name)+' logo" onerror="this.remove()">';
  if(b.name) h += '<div class="brand-name">'+esc(b.name)+'</div>';
  h += '</div>';
  return h;
}
function docBlock(inv){
  return '<div class="doc-block"><div class="doc-title">'+esc(inv.meta.title)+'</div><div class="doc-number">'+esc(inv.meta.number)+'</div></div>';
}
function metaItemsList(inv){
  var m = inv.meta;
  var items = [{ k:"Issue date", v:m.issueDate }];
  if(m.hasDueDate) items.push({ k:"Due date", v:m.dueDate });
  if(m.hasPaymentTerms) items.push({ k:"Payment terms", v:m.paymentTerms });
  if(m.hasPO) items.push({ k:"PO number", v:m.poNumber });
  return items.filter(function(i){ return i.v; });
}
function metaStrip(inv){
  var m = metaItemsList(inv);
  if(!m.length) return "";
  return '<div class="meta-strip">'+m.map(function(x){
    return '<div class="meta-item"><span class="k">'+esc(x.k)+'</span><span class="v">'+esc(x.v)+'</span></div>';
  }).join("")+'</div>';
}
function bizLines(b){
  var lines = [];
  if(b.contactName) lines.push(b.contactName);
  b.address.forEach(function(l){ lines.push(l); });
  var ep = [b.email, b.phone].filter(Boolean).join(" · ");
  if(ep) lines.push(ep);
  if(b.website) lines.push(b.website);
  if(b.taxId) lines.push("Tax ID: " + b.taxId);
  return lines;
}
function cliName(c){ return c.company || c.contactName || ""; }
function cliLines(c){
  var lines = [];
  if(c.company && c.contactName) lines.push(c.contactName);
  c.address.forEach(function(l){ lines.push(l); });
  var ep = [c.email, c.phone].filter(Boolean).join(" · ");
  if(ep) lines.push(ep);
  if(c.taxId) lines.push("Tax ID: " + c.taxId);
  return lines;
}
function partyHtml(label, name, lines, extraClass){
  if(!name && lines.length === 0) return "";
  var h = '<div class="party'+(extraClass ? " " + extraClass : "")+'">';
  if(label) h += '<div class="party-label">'+esc(label)+'</div>';
  if(name) h += '<div class="party-name">'+esc(name)+'</div>';
  lines.forEach(function(l){ h += '<div class="party-line">'+esc(l)+'</div>'; });
  h += '</div>';
  return h;
}
function partiesRow(inv, wrapClass){
  var from = partyHtml("From", inv.business.name, bizLines(inv.business));
  var to = partyHtml("Bill To", cliName(inv.client), cliLines(inv.client));
  if(!from && !to) return "";
  return '<div class="parties-row'+(wrapClass ? " " + wrapClass : "")+'">'+from+to+'</div>';
}
function itemsTableHtml(inv, items){
  var showSku = inv.hasSku;
  var th = "<tr>";
  if(showSku) th += '<th class="col-sku">SKU</th>';
  th += '<th class="col-desc">Description</th><th class="col-qty num">Qty</th><th class="col-rate num">Rate</th><th class="col-amount num">Amount</th></tr>';
  var rows = items.map(function(it){
    var r = "<tr>";
    if(showSku) r += '<td class="col-sku">'+esc(it.sku)+'</td>';
    r += '<td class="col-desc">'+esc(it.description)+'</td>';
    r += '<td class="col-qty num">'+formatQty(it.quantity)+'</td>';
    r += '<td class="col-rate num">'+formatCurrency(it.unitPrice, inv.meta.currencySymbol)+'</td>';
    r += '<td class="col-amount num">'+formatCurrency(it.amount, inv.meta.currencySymbol)+'</td></tr>';
    return r;
  }).join("");
  if(!rows) rows = '<tr class="empty-row"><td colspan="'+(showSku?5:4)+'">No line items on this invoice</td></tr>';
  return '<table class="inv-table"><thead>'+th+'</thead><tbody>'+rows+'</tbody></table>';
}
function itemsBlock(inv, items){
  return '<div class="items-wrap">'+itemsTableHtml(inv, items)+'</div>';
}
function totalsRows(inv){
  var t = inv.totals;
  var h = '<div class="row subtotal"><span>Subtotal</span><span>'+formatCurrency(t.subtotal, inv.meta.currencySymbol)+'</span></div>';
  if(t.hasTax){
    var taxLabel = (t.taxRate !== undefined && t.taxRate !== null && t.taxRate !== "") ? t.taxLabel + " (" + t.taxRate + "%)" : t.taxLabel;
    h += '<div class="row tax"><span>'+esc(taxLabel)+'</span><span>'+formatCurrency(t.taxAmount, inv.meta.currencySymbol)+'</span></div>';
  }
  if(t.hasDiscount){
    h += '<div class="row discount"><span>'+esc(t.discountLabel)+'</span><span>&minus;'+formatCurrency(t.discountAmount, inv.meta.currencySymbol)+'</span></div>';
  }
  h += '<div class="row total"><span>Total due</span><span>'+formatCurrency(t.total, inv.meta.currencySymbol)+'</span></div>';
  return h;
}
function totalsHtml(inv){ return '<div class="inv-totals">'+totalsRows(inv)+'</div>'; }
function paymentHtml(inv, opts){
  opts = opts || {};
  if(!hasPaymentMethods(inv) && !hasQrCode(inv)) return "";
  var h = '<div class="pay-block'+(opts.extraClass?" "+opts.extraClass:"")+'">';
  h += '<div class="block-label">'+esc(opts.label || "Payment Information")+'</div>';
  if(hasPaymentMethods(inv)){
    h += '<div class="pay-methods">';
    inv.payment.methods.forEach(function(m){
      h += '<div class="pay-method"><span class="pay-method-label">'+esc(m.label)+'</span><span class="pay-method-value">';

/* ==========================================================================
   4. PAGINATION
   Each template declares a row-budget config; paginateItems() splits the
   items array into page chunks, reserving room for the footer block (totals
   / payment / notes / signature) on whichever page ends up last.
   ========================================================================== */
function computeCapacity(cfg, isFirst, withFooter){
  var header = isFirst ? cfg.headerFirst : cfg.headerOther;
  var footer = withFooter ? cfg.footer : 0;
  return Math.max(cfg.pageRows - header - footer, 3);
}
function paginateItems(items, cfg){
  var pages = [];
  var remaining = items.slice();
  var first = true;
  while(remaining.length > 0){
    var capWithFooter = computeCapacity(cfg, first, true);
    if(remaining.length <= capWithFooter){
      pages.push({ items: remaining, first: first, last: true });
      remaining = [];
      break;
    }
    var capNoFooter = computeCapacity(cfg, first, false);
    var take = remaining.splice(0, capNoFooter);
    pages.push({ items: take, first: first, last: false });
    first = false;
  }
  if(pages.length === 0){
    pages.push({ items: [], first: true, last: true });
  } else if(!pages[pages.length - 1].last){
    pages.push({ items: [], first: false, last: true });
  }
  return pages;
}

/* ==========================================================================
   6. PAGE ASSEMBLY
   ========================================================================== */
function defaultRenderItems(inv, items){ return itemsBlock(inv, items); }

function assembleTemplate(key, inv){
  var tpl = TEMPLATES[key];
  var pages = paginateItems(inv.items, tpl.cfg);
  var n = pages.length;
  return pages.map(function(p, i){
    var pageNum = i + 1;
    var head = p.first ? tpl.renderHeader(inv) : continuationHeader(inv, pageNum, n);
    var itemsHtml = (tpl.renderItems || defaultRenderItems)(inv, p.items, p.last);
    var footHtml = p.last ? tpl.renderFooter(inv) : "";
    var badge = n > 1 ? '<div class="page-badge">Page '+pageNum+' of '+n+'</div>' : "";
    var bodyWrap;
    if(tpl.wrapsBody){
      bodyWrap = p.first ? (head + itemsHtml + footHtml) : (head + '<div class="page-body">' + itemsHtml + (p.last ? tpl.renderFooter(inv) : '') + '</div>');
    } else {
      bodyWrap = head + itemsHtml + footHtml;
    }
    return '<section class="invoice-page tpl-'+key+'" data-template="'+key+'" data-page="'+pageNum+'">'+bodyWrap+badge+'</section>';
  }).join("");
}

/* ==========================================================================
   7. TEST DATA PRESETS
   ========================================================================== */
function buildManyItems(n){
  var catalog = ["Consulting Session","Design Revision","Development Sprint","Content Writing","SEO Audit","Server Maintenance","Bug Fix Package","Feature Implementation","QA Testing Pass","Client Meeting","Wireframing","Brand Asset Delivery"];
  var items = [];
  for(var i = 0; i < n; i++){
    var qty = 1 + (i % 4);
    var price = 25 + (i % 9) * 15;
    items.push({ description: catalog[i % catalog.length] + " #" + (i + 1), sku:"", quantity: qty, unit_price: price, amount: qty * price });
  }
  return items;
}
function recomputeTotals(d){
  var subtotal = d.items.reduce(function(s, it){
    var amt = it.amount != null ? Number(it.amount) : (Number(it.quantity)||0) * (Number(it.unit_price)||0);
    return s + (Number(amt) || 0);
  }, 0);
  d.totals.subtotal = round2(subtotal);
  if(d.totals.tax && d.totals.tax.enabled){
    d.totals.tax.amount = round2(subtotal * (Number(d.totals.tax.rate) || 0) / 100);
  }
  var tax = (d.totals.tax && d.totals.tax.enabled) ? Number(d.totals.tax.amount) || 0 : 0;
  var discount = (d.totals.discount && d.totals.discount.enabled) ? Number(d.totals.discount.amount) || 0 : 0;
  d.totals.total = round2(subtotal + tax - discount);
}

var PRESETS = [
  { key:"full", label:"Full Data", apply:function(d){ return d; } },
  { key:"noNotes", label:"No Notes", apply:function(d){ d.additional.notes = ""; return d; } },
  { key:"noTerms", label:"No Terms", apply:function(d){ d.additional.terms = ""; return d; } },
  { key:"noLogo", label:"No Logo", apply:function(d){ d.business.logo = ""; return d; } },
  { key:"noSignature", label:"No Signature", apply:function(d){ d.additional.signature.enabled = false; return d; } },
  { key:"noQr", label:"No QR", apply:function(d){ d.payment.qr_code.enabled = false; return d; } },
  { key:"noTax", label:"No Tax", apply:function(d){ d.totals.tax.enabled = false; recomputeTotals(d); return d; } },
  { key:"noDiscount", label:"No Discount", apply:function(d){ d.totals.discount.enabled = false; recomputeTotals(d); return d; } },
  { key:"bankOnly", label:"Bank Only", apply:function(d){ ["payoneer","jazzcash","easypaisa","online_payment"].forEach(function(k){ d.payment[k].enabled = false; }); d.payment.qr_code.enabled = false; return d; } },
  { key:"onlineOnly", label:"Online Payment Only", apply:function(d){ ["bank_transfer","payoneer","jazzcash","easypaisa"].forEach(function(k){ d.payment[k].enabled = false; }); return d; } },
  { key:"manyItems", label:"Many Items", apply:function(d){ d.items = buildManyItems(28); recomputeTotals(d); return d; } }
];

/* ==========================================================================
   8. APP STATE + WIRING
   ========================================================================== */
var RAW = null;
var CURRENT = null;
var activeTemplate = "essential";
var activePreset = "full";

function renderAll(){
  if(!CURRENT) return;
  var inv = normalizeInvoice(CURRENT);
  var stack = document.getElementById("pageStack");
  stack.innerHTML = assembleTemplate(activeTemplate, inv);

  var tpl = TEMPLATES[activeTemplate];
  document.getElementById("toolbarTitle").textContent = tpl.name;
  document.getElementById("toolbarTag").textContent = tpl.tag;

  document.querySelectorAll(".template-item").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-template") === activeTemplate);
  });
  document.querySelectorAll(".preset-btn").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-preset") === activePreset);
  });
}

function buildSidebar(){
  var nav = document.getElementById("templateNav");
  var i = 0;
  nav.innerHTML = Object.keys(TEMPLATES).map(function(key){
    i++;
    var t = TEMPLATES[key];
    var num = (i < 10 ? "0" : "") + i;
    return '<li><button type="button" class="template-item" data-template="'+key+'" style="--dot:'+t.dot+'">'+
      '<span class="dot"></span><span class="item-copy"><span class="item-name">'+num+' '+esc(t.name)+'</span>'+
      '<span class="item-desc">'+esc(t.tag)+'</span></span></button></li>';
  }).join("");
  nav.addEventListener("click", function(e){
    var btn = e.target.closest(".template-item");
    if(!btn) return;
    activeTemplate = btn.getAttribute("data-template");
    renderAll();
  });
}

function buildTestPanel(){
  var row = document.getElementById("presetRow");
  row.innerHTML = PRESETS.map(function(p){
    return '<button type="button" class="preset-btn" data-preset="'+p.key+'">'+esc(p.label)+'</button>';
  }).join("");
  row.addEventListener("click", function(e){
    var btn = e.target.closest(".preset-btn");
    if(!btn) return;
    applyPreset(btn.getAttribute("data-preset"));
  });
}

function applyPreset(key){
  var preset = PRESETS.filter(function(p){ return p.key === key; })[0] || PRESETS[0];
  CURRENT = preset.apply(deepClone(RAW));
  activePreset = key;
  renderAll();
}

function wireToolbar(){
  document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
  document.getElementById("testToggleBtn").addEventListener("click", function(){
    var panel = document.getElementById("testPanel");
    var btn = document.getElementById("testToggleBtn");
    panel.hidden = !panel.hidden;
    btn.classList.toggle("active", !panel.hidden);
  });
}

function showLoadError(){
  var el = document.getElementById("loadError");
  var isFile = location.protocol === "file:";
  el.innerHTML = isFile
    ? 'Could not load <code>invoice-data.json</code> — browsers block local file loading over <code>file://</code>. Serve this folder with a local server, e.g. <code>python3 -m http.server</code>, then open <code>http://localhost:8000/freeTemplates.html</code>.'
    : 'Could not load <code>invoice-data.json</code>. Make sure the file exists alongside this page.';
  el.hidden = false;
}
function hideLoadError(){ document.getElementById("loadError").hidden = true; }

function init(){
  buildSidebar();
  buildTestPanel();
  wireToolbar();
  renderAll(); // no-op until data arrives, wires up empty state safely

  fetch("./invoice-data.json")
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(data){
      RAW = data;
      CURRENT = deepClone(RAW);
      hideLoadError();
      renderAll();
    })
    .catch(function(){ showLoadError(); });
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

})();
