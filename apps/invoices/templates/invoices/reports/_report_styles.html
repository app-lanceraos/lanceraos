{# Shared by both money-report PDFs. Fonts come from FONT_CONTEXT (file:// URIs, WeasyPrint only). #}
<style>
  @font-face { font-family: 'IBM Plex Sans'; src: url('{{ font_ibm_plex_sans_regular }}'); font-weight: 400; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('{{ font_ibm_plex_sans_semibold }}'); font-weight: 600; }
  @font-face { font-family: 'Source Serif 4'; src: url('{{ font_source_serif_regular }}'); font-weight: 400; }
  @font-face { font-family: 'Source Serif 4'; src: url('{{ font_source_serif_semibold }}'); font-weight: 600; }

  @page {
    size: A4;
    margin: 16mm 16mm 20mm 16mm;
    @bottom-left { content: "Generated by LanceraOS on {{ generated_on }}"; font-family: 'IBM Plex Sans'; font-size: 7.5pt; color: #64748b; }
    @bottom-right { content: "Page " counter(page) " of " counter(pages); font-family: 'IBM Plex Sans'; font-size: 7.5pt; color: #64748b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'IBM Plex Sans', Arial, sans-serif; color: #1e293b; font-size: 9.5pt; line-height: 1.5; }
  .wrap { overflow-wrap: anywhere; word-break: break-word; }

  .letterhead { display: flex; align-items: flex-start; border-bottom: 2pt solid #1e293b; padding-bottom: 10pt; margin-bottom: 16pt; }
  .letterhead .logo { max-height: 40pt; max-width: 120pt; margin-right: 12pt; flex: none; }
  .letterhead .who { flex: 1 1 0; min-width: 0; }
  .letterhead .name { font-size: 14pt; font-weight: 600; line-height: 1.25; }
  .letterhead .address { font-size: 8.5pt; color: #475569; margin-top: 3pt; }

  h1.title { margin: 0 0 4pt; font-size: 20pt; font-weight: 600; line-height: 1.2; }
  .meta { font-size: 9pt; color: #475569; margin: 0 0 2pt; }

  h2 { margin: 18pt 0 6pt; font-size: 10.5pt; font-weight: 600; break-after: avoid; }

  table.data { width: 100%; border-collapse: collapse; margin: 0 0 6pt; }
  table.data thead { display: table-header-group; }
  table.data tr { break-inside: avoid; }
  table.data th { text-align: left; font-size: 7.5pt; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: 0.04em; padding: 5pt 6pt; border-bottom: 1.25pt solid #1e293b; }
  table.data td { padding: 5pt 6pt; border-bottom: 0.5pt solid #e2e8f0; font-size: 9pt; vertical-align: top; }
  table.data th.num, table.data td.num { text-align: right; white-space: nowrap; padding-left: 14pt; }
  table.data tr.total td { font-weight: 600; border-top: 1pt solid #1e293b; border-bottom: none; }
  table.data td.empty { text-align: center; color: #64748b; padding: 12pt 6pt; }

  .notes { margin: 6pt 0 0; padding-left: 16pt; font-size: 8.5pt; color: #334155; }
  .notes li { margin-bottom: 4pt; break-inside: avoid; }
</style>
