<style>
  /* Real filesystem file:// URIs (WeasyPrint) or /static/ URLs (portal/
     editor canvas) — whichever the caller's base_context already carries
     (build_pdf_context vs build_portal_context vs design_preview's
     editor-canvas context), exactly like the 3 static templates. Every
     font the editor's own FONT_OPTIONS list offers gets a face here, since
     any zone_1/zone_2 element could reference any of them. Shared between
     dynamic_design.html (the real invoice/portal render) and
     editor_canvas.html (Step 8b's canvas, 20 August 2026 rework — see
     DECISIONS.md) so both use byte-identical CSS class definitions; only
     the surrounding document markup differs between the two.
     design_primary_color/design_secondary_color come from the SAME
     resolve_design_colors call either caller already made. */
  @font-face { font-family: 'IBM Plex Sans'; src: url('{{ font_ibm_plex_sans_regular }}'); font-weight: 400; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('{{ font_ibm_plex_sans_semibold }}'); font-weight: 600; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('{{ font_ibm_plex_mono_regular }}'); font-weight: 400; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('{{ font_ibm_plex_mono_semibold }}'); font-weight: 600; }
  @font-face { font-family: 'Source Serif 4'; src: url('{{ font_source_serif_regular }}'); font-weight: 400; }
  @font-face { font-family: 'Source Serif 4'; src: url('{{ font_source_serif_semibold }}'); font-weight: 600; }
  @font-face { font-family: 'Space Grotesk'; src: url('{{ font_space_grotesk }}'); font-weight: 400; }
  @font-face { font-family: 'Space Grotesk'; src: url('{{ font_space_grotesk }}'); font-weight: 700; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    color: #262420;
    background: #ffffff;
    font-size: 9.5pt;
    line-height: 1.5;
  }

  /* Sidebar — modern.html's own real technique, replicated exactly:
     position:fixed repeats it on every generated page. */
  .dyn-sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: {{ sidebar_width_mm }}mm;
    background: {{ design_primary_color }};
    color: #ffffff;
    padding: 14mm 6mm 12mm;
    display: flex;
    flex-direction: column;
  }
  .dyn-sidebar .dyn-sidebar-el { margin-bottom: 6mm; }
  .dyn-sidebar img { max-width: 100%; }
  .dyn-sidebar .dyn-spacer { flex: 1; }

  .dyn-main {
    {% if has_sidebar %}margin-left: {{ sidebar_width_mm }}mm;{% endif %}
    padding: 16mm 16mm 16mm {% if has_sidebar %}16mm{% else %}20mm{% endif %};
  }

  .dyn-zone1 { position: relative; }
  .dyn-zone1-el { overflow: hidden; }

  .dyn-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 7.5pt;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: {{ design_primary_color }};
    margin-bottom: 2mm;
  }
  .dyn-bizname { font-size: 18pt; font-weight: 600; margin: 0 0 1mm; }
  .dyn-tagline { font-size: 8.5pt; color: #7a7568; }

  .dyn-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 7.5pt;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: {{ design_primary_color }};
    margin-bottom: 2.5mm;
  }
  .dyn-partyname { font-size: 11pt; font-weight: 600; margin-bottom: 1mm; }
  .dyn-line { color: #55524a; font-size: 9pt; }

  .dyn-num { font-size: 12pt; font-weight: 600; margin-bottom: 2mm; }
  .dyn-daterow { color: #7a7568; font-size: 8.5pt; margin-top: 1mm; }
  .dyn-daterow b { color: #262420; font-weight: 600; margin-left: 2mm; }

  table.dyn-items { width: 100%; border-collapse: collapse; margin-bottom: 2mm; }
  table.dyn-items thead { display: table-header-group; }
  table.dyn-items thead th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 7.5pt;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #7a7568;
    text-align: left;
    padding: 0 3mm 3mm 0;
  }
  table.dyn-items thead th.dyn-num-col { text-align: right; }
  table.dyn-items tbody td {
    padding: 3.5mm 3mm 3.5mm 0;
    font-size: 9pt;
    vertical-align: top;
  }
  table.dyn-items tbody td.dyn-num-col { text-align: right; font-family: 'IBM Plex Mono', monospace; }

  .dyn-row { display: flex; justify-content: space-between; font-size: 9pt; color: #55524a; padding: 1.4mm 0; }
  .dyn-row-due {
    border-top: 0.4mm solid {{ design_secondary_color }};
    margin-top: 2mm;
    padding-top: 3mm;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13pt;
    font-weight: 600;
    color: {{ design_secondary_color }};
  }
  .dyn-pkr { font-size: 7.5pt; color: #a09a89; margin-top: 1mm; }
  .dyn-total-pill {
    display: inline-block;
    background: {{ design_secondary_color }};
    color: #16151c;
    border-radius: 3mm;
    padding: 3mm 5mm;
    margin-top: 2mm;
    font-size: 16pt;
    font-weight: 700;
  }
  .dyn-total-due-lbl {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8pt;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: {{ design_primary_color }};
    margin-bottom: 1mm;
  }
  .dyn-total-due-amt { font-family: 'IBM Plex Mono', monospace; font-size: 30pt; font-weight: 600; }

  .dyn-method {
    display: flex;
    justify-content: space-between;
    font-size: 8.5pt;
    padding: 1.6mm 0;
  }
  .dyn-method span:first-child {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 7.5pt;
    color: #a09a89;
    text-transform: uppercase;
  }

  .dyn-payonline { display: flex; align-items: center; gap: 4mm; }
  .dyn-qr { width: 20mm; height: 20mm; }
  .dyn-link { font-family: 'IBM Plex Mono', monospace; font-size: 7.5pt; color: #55524a; word-break: break-all; }

  .dyn-sig-img { height: 14mm; margin-bottom: 1mm; }
  .dyn-sig-line {
    border-top: 0.3mm solid {{ design_secondary_color }};
    padding-top: 2.5mm;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 7.5pt;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #a09a89;
  }

  .dyn-pair-row { display: flex; gap: 10mm; align-items: flex-end; }
  .dyn-pair-row > div { flex: 1; }

  .dyn-sidebar .dyn-label, .dyn-sidebar .dyn-eyebrow { color: {{ design_secondary_color }}; }
  .dyn-sidebar .dyn-line, .dyn-sidebar .dyn-tagline { color: #c3c0e0; }
  .dyn-sidebar .dyn-link { color: #c3c0e0; }
</style>
